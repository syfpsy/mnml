name: Release

# Build and publish the Windows installer when a version tag is pushed.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run build:release

      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/mnml-setup.exe release/latest.yml release/mnml-setup.exe.blockmap \
            --title "${{ github.ref_name }}" \
            --notes "Hotfix: restores startup after v0.2.45 (native SQLite bindings were missing). See CHANGELOG.md for v0.2.46." \
            --latest
