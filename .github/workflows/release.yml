name: Release

# Triggers when a version tag is pushed (e.g. v0.2.5)
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write   # required to create a GitHub Release and upload assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
          npm ci

      # Restore the heroui-pro dist from the vendored archive.
      # The package's postinstall requires a licensed auth token to download
      # the dist at install time; we vendor it instead so CI stays self-contained.
      # The tarball also includes package.json, because the npm-published package
      # ships without the exports map — the postinstall adds it after CDN download.
      - name: Restore @heroui-pro/react dist
        shell: bash
        run: tar -xzf vendor/heroui-pro-react-dist.tgz -C node_modules/@heroui-pro/react

      # build:publish skips bump-version.mjs and tsc — the version is whatever
      # is already committed in package.json at the time the tag was pushed.
      # Type-checking is done locally before tagging (npm run build).
      - name: Build & publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:publish
