name: Release (manual)

# GitHub Actions minutes are optional. Default release path is local:
#   Windows:  scripts/release-local-win.ps1
#   macOS:    scripts/mac-mini-release.sh  (sign + notarize on Mac mini)
#
# Re-enable CI builds when minutes are available — trigger manually here.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.8)"
        required: true
        type: string
      platform:
        description: "Platform to build"
        required: true
        type: choice
        options:
          - windows
          - macos
          - both

jobs:
  build-windows:
    if: inputs.platform == 'windows' || inputs.platform == 'both'
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:release:win
      - run: npm run verify:release -- win
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            release/mnml-setup.exe
            release/latest.yml
            release/mnml-setup.exe.blockmap

  build-macos:
    if: inputs.platform == 'macos' || inputs.platform == 'both'
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:release:mac
      - run: npm run verify:release -- mac
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            release/mnml-mac.zip
            release/mnml-mac.dmg
            release/latest-mac.yml
            release/mnml-mac.zip.blockmap

  publish:
    needs: [build-windows, build-macos]
    if: |
      always() &&
      (needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          NOTES=$(mktemp)
          VERSION="${TAG#v}"
          node scripts/extract-changelog.mjs "$VERSION" > "$NOTES" || echo "Release $TAG" > "$NOTES"
          FILES=$(find artifacts -type f 2>/dev/null | tr '\n' ' ')
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" $FILES --title "$TAG" --notes-file "$NOTES" --latest
          else
            gh release upload "$TAG" $FILES --clobber
          fi
