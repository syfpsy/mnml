<!--
  mnml app icon — master SVG.

  Geometry (256 × 256 canvas):
    · Bg: rounded square, corner radius 56 (22 %), fill #0e0f12.
    · Letter "m" (small-caps proportions): off-white #e8e8e6.
      Two stems with a V counterform cut into the top via the evenodd
      fill rule — same negative-space technique a real typeface uses.
      Bounding box x = 56..144 (88 wide), y = 80..176 (96 tall).
    · Orange dot: #fb923c, radius 16, centered at (184, 160).
      Bottom of the dot aligns with the M's baseline (y = 176) so the
      dot reads as a baseline-aligned mark, not a middot.

  Re-generate raster assets after editing:  npm run icons
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" rx="56" fill="#0e0f12"/>
  <path fill-rule="evenodd" fill="#e8e8e6" d="
    M56,80 L144,80 L144,176 L56,176 Z
    M78,80 L100,140 L122,80 L122,176 L78,176 Z
  "/>
  <circle cx="184" cy="160" r="16" fill="#fb923c"/>
</svg>
