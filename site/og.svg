<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background — cool-tinted dark, identical to the app -->
  <rect width="1200" height="630" fill="#0e0f12"/>

  <!-- Subtle radial warm glow behind the brand mark (matches the orange dot) -->
  <defs>
    <radialGradient id="glow" cx="0.18" cy="0.52" r="0.42">
      <stop offset="0%"   stop-color="#fb923c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Brand mark: small-caps M + orange dot. Scaled-up version of the
       app icon's geometry. Reading "M·" left-of-wordmark. -->
  <g transform="translate(120, 220)">
    <path fill-rule="evenodd" fill="#e8e8e6" d="
      M0,0 L96,0 L96,128 L0,128 Z
      M24,0 L48,80 L72,0 L72,128 L24,128 Z
    "/>
    <circle cx="128" cy="112" r="20" fill="#fb923c"/>
  </g>

  <text x="280" y="340" font-family="Segoe UI Variable Display, Segoe UI, -apple-system, system-ui, sans-serif"
        font-size="180" font-weight="800" letter-spacing="-6" fill="#e8e8e6">mnml</text>

  <text x="120" y="448" font-family="Segoe UI Variable Display, Segoe UI, -apple-system, system-ui, sans-serif"
        font-size="44" font-weight="600" fill="#e8e8e6" letter-spacing="-1.5">
    A keyboard-first clipboard for Windows.
  </text>

  <text x="120" y="508" font-family="Segoe UI Variable Display, Segoe UI, -apple-system, system-ui, sans-serif"
        font-size="26" fill="#9494a0">
    Press Alt twice. Paste, launch, save snippets.
  </text>

  <!-- Bottom-right key pill -->
  <g transform="translate(900, 480)">
    <rect width="180" height="60" rx="10" fill="#181a1f" stroke="#3a3a44" stroke-width="1"/>
    <text x="90" y="40" text-anchor="middle"
          font-family="Cascadia Code, Consolas, ui-monospace, monospace"
          font-size="22" font-weight="600" fill="#e8e8e6">Alt + Alt</text>
  </g>

  <!-- Bottom-left tagline -->
  <text x="120" y="570" font-family="Cascadia Code, Consolas, ui-monospace, monospace"
        font-size="20" fill="#7e7e85">local · keyboard-first · MIT</text>
</svg>
