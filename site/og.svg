<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background — cool-tinted dark, identical to the app -->
  <rect width="1200" height="630" fill="#0e0f12"/>

  <!-- Subtle radial emerald glow behind the wordmark -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.6" r="0.45">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Wordmark dot + name -->
  <g transform="translate(120, 240)">
    <circle cx="32" cy="58" r="26" fill="#34d399"/>
    <circle cx="32" cy="58" r="46" fill="#34d399" fill-opacity="0.10"/>
  </g>

  <text x="220" y="320" font-family="Segoe UI Variable Display, Segoe UI, -apple-system, system-ui, sans-serif"
        font-size="180" font-weight="800" letter-spacing="-6" fill="#e8e8e6">mnml</text>

  <text x="120" y="430" font-family="Segoe UI Variable Display, Segoe UI, -apple-system, system-ui, sans-serif"
        font-size="44" font-weight="600" fill="#e8e8e6" letter-spacing="-1.5">
    A keyboard-first clipboard for Windows.
  </text>

  <text x="120" y="490" font-family="Segoe UI Variable Display, Segoe UI, -apple-system, system-ui, sans-serif"
        font-size="26" fill="#9494a0">
    Press Alt twice. Paste, launch, save snippets.
  </text>

  <!-- Bottom-right key pill -->
  <g transform="translate(900, 480)">
    <rect width="180" height="60" rx="10" fill="#181a1f" stroke="#3a3a44" stroke-width="1"/>
    <text x="90" y="40" text-anchor="middle"
          font-family="Cascadia Code, Consolas, ui-monospace, monospace"
          font-size="22" font-weight="600" fill="#e8e8e6">Alt + Alt</text>
  </g>

  <!-- Bottom-left version stamp -->
  <text x="120" y="570" font-family="Cascadia Code, Consolas, ui-monospace, monospace"
        font-size="20" fill="#7e7e85">github.com/syfpsy/mnml</text>
</svg>
